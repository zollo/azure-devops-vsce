name: Release Please

# On every push to main, release-please keeps a release pull request ("chore: release X.Y.Z")
# up to date: it bumps package.json / package-lock.json from the Conventional Commits merged
# since the last release and adds them to CHANGELOG.md. Nothing is released until you merge
# that pull request. Merging it tags vX.Y.Z, creates the GitHub Release with the changelog
# notes, and starts the Release workflow (release.yml), which builds, tests and attaches the
# VSIX.
#
# The Marketplace stays off by default: set the repository variable MARKETPLACE_PUBLISH to
# "true" to publish automatically, or run the Release workflow by hand on main with the tag
# and "marketplace" ticked.
#
# Setup: Settings > Actions > General > "Allow GitHub Actions to create and approve pull
# requests" must be on. Pull requests and pushes made with the default token don't start
# pull_request workflows, so this workflow dispatches CI and the Conventional Commits check on
# the release PR branch; their check runs land on its head commit, so required checks pass.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Update release PR or release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Tidy the release PR before its checks run:
      # - Merge commits repeat the PR title in their body, which release-please reads as a second
      #   change, so drop entries that only differ by commit link (scripts/dedupe_changelog.py),
      #   in CHANGELOG.md and in the PR body that becomes the GitHub Release notes.
      # - release-please writes LF line endings; this repo keeps package.json, package-lock.json
      #   and CHANGELOG.md as CRLF, so convert them back.
      - name: Check out the release PR
        if: steps.release.outputs.pr
        uses: actions/checkout@v5
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
          path: release-pr

      - name: Drop duplicate changelog entries, keep CRLF and push
        if: steps.release.outputs.pr
        working-directory: release-pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
          PR_NUMBER: ${{ fromJSON(steps.release.outputs.pr || '{}').number }}
        run: |
          python3 scripts/dedupe_changelog.py CHANGELOG.md
          for f in package.json package-lock.json CHANGELOG.md; do
            sed -i 's/\r*$/\r/' "$f"
          done

          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body -q .body > "$RUNNER_TEMP/body.md"
          if ! python3 scripts/dedupe_changelog.py --check "$RUNNER_TEMP/body.md"; then
            python3 scripts/dedupe_changelog.py "$RUNNER_TEMP/body.md"
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
          fi

          if git diff --quiet; then
            echo "Release PR already tidy."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: tidy release changelog and keep CRLF line endings"
          git push origin "HEAD:$BRANCH"

      # Step env is evaluated even when the step's if: is false, so fromJSON gets a fallback
      # for runs where release-please has no release PR (for example right after a release).
      # Run after the CRLF push so the checks are on the release PR's final head commit.
      - name: Run CI and the Conventional Commits check on the release PR
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          gh workflow run commitlint.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

      # Safety net in case the release PR body wasn't tidied (for example it was edited by
      # hand after the last push to main): drop duplicate entries from the release notes.
      - name: Drop duplicate entries from the release notes
        if: steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GITHUB_REPOSITORY/contents/scripts/dedupe_changelog.py?ref=$TAG" \
            > "$RUNNER_TEMP/dedupe_changelog.py"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > "$RUNNER_TEMP/notes.md"
          if python3 "$RUNNER_TEMP/dedupe_changelog.py" --check "$RUNNER_TEMP/notes.md"; then
            echo "Release notes have no duplicates."; exit 0
          fi
          python3 "$RUNNER_TEMP/dedupe_changelog.py" "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"

      # Tags and releases made with the default token don't trigger the tag push in
      # release.yml, so start it explicitly (workflow_dispatch is allowed).
      - name: Start the Release workflow
        if: steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
          MARKETPLACE: ${{ vars.MARKETPLACE_PUBLISH == 'true' }}
        run: |
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f tag="$TAG" -f marketplace="$MARKETPLACE"
          echo "::notice::Started the Release workflow for $TAG (marketplace=$MARKETPLACE)."
