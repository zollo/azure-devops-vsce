name: Release

# Push a tag like v0.3.0 (matching package.json "version") to build the VSIX once,
# attach it to a GitHub Release and publish the same file to the VS Code Marketplace.
#
# Setup (repository Settings):
#   Environment "marketplace" (optionally with required reviewers) holding ONE of:
#     - Microsoft Entra ID via OIDC (preferred, no long-lived token):
#         variables AZURE_CLIENT_ID and AZURE_TENANT_ID for an app/managed identity with a
#         federated credential for this repo's "marketplace" environment, added as a member
#         of the Marketplace publisher.
#     - or secret VSCE_PAT: Azure DevOps PAT, Organization "All accessible organizations",
#         scope Marketplace (Manage).
#   Optional secret OVSX_PAT to also publish to Open VSX (for VSCodium, Cursor and others).

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.3.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      vsix: ${{ steps.version.outputs.vsix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check tag, version and publisher
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHER=$(node -p "require('./package.json').publisher")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"; exit 1
          fi
          if [ "$PUBLISHER" = "publisher-tbd" ]; then
            echo "::error::Set the real Marketplace publisher ID in package.json before releasing"; exit 1
          fi
          # Require a dated entry such as "## [0.3.0] - 2026-12-01" (dots escaped for the regex).
          VERSION_RE=$(printf '%s' "$VERSION" | sed 's/[.]/\\./g')
          if ! grep -qE "^## \[$VERSION_RE\] - [0-9]{4}-[0-9]{2}-[0-9]{2}\s*$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md needs a dated '## [$VERSION] - YYYY-MM-DD' entry"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=ado-boards-$VERSION.vsix" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: xvfb-run -a npm run test:integration

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --out "${{ steps.version.outputs.vsix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.version.outputs.vsix }}
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix

      # Safe to re-run: if a release for this tag already exists, keep it and its VSIX as they
      # are, so a retry after a failed publish job never replaces an already released file.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          VSIX: ${{ needs.build.outputs.vsix }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qxF "$VSIX"; then
              echo "::notice::Release $TAG already has $VSIX; reusing it."
            else
              echo "::notice::Release $TAG exists without $VSIX; attaching it."
              gh release upload "$TAG" "$VSIX" --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$TAG" "$VSIX" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ADO Boards $TAG" \
              --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md) for details. ADO Boards is a community fork of Azure DevOps Boards by Damilola Onadeinde." \
              --verify-tag
          fi

  marketplace:
    name: Publish to VS Code Marketplace
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      # Publish the exact file attached to the GitHub Release (it may come from an earlier run).
      - name: Download VSIX from the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "${{ needs.build.outputs.vsix }}"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sign in to Azure (OIDC)
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish with Entra ID
        if: vars.AZURE_CLIENT_ID != ''
        run: npx --yes @vscode/vsce publish --packagePath "${{ needs.build.outputs.vsix }}" --azure-credential

      - name: Publish with PAT
        if: vars.AZURE_CLIENT_ID == ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Configure AZURE_CLIENT_ID/AZURE_TENANT_ID variables or a VSCE_PAT secret in the marketplace environment"; exit 1
          fi
          npx --yes @vscode/vsce publish --packagePath "${{ needs.build.outputs.vsix }}"

  open-vsx:
    name: Publish to Open VSX (optional)
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
    steps:
      # Publish the exact file attached to the GitHub Release (it may come from an earlier run).
      - name: Download VSIX from the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "${{ needs.build.outputs.vsix }}"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT is not set; skipping Open VSX."; exit 0
          fi
          npx --yes ovsx publish "${{ needs.build.outputs.vsix }}" --pat "$OVSX_PAT"
