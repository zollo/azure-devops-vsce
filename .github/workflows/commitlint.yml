name: Conventional Commits

# Pull request titles and commit messages must follow Conventional Commits
# (https://www.conventionalcommits.org); release-please turns them into the next version and
# the CHANGELOG. Rules: commitlint.config.mjs. Merge commits are ignored.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: commitlint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Check PR title and commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx --no -- commitlint --verbose

      - name: Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: npx --no -- commitlint --from "$BASE" --to "$HEAD" --verbose
