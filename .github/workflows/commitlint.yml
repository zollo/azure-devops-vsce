name: Conventional Commits

# Pull request titles and commit messages must follow Conventional Commits
# (https://www.conventionalcommits.org); release-please turns them into the next version and
# the CHANGELOG. Rules: commitlint.config.mjs. Merge commits are ignored.
#
# release-please.yml dispatches this on its release PR branch, because pull requests and pushes
# made with the default token don't trigger pull_request workflows. A dispatched run lints the
# open PR for that branch, so the required check also appears on the release PR's head commit.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: commitlint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Check PR title and commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TITLE: ${{ github.event.pull_request.title }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            TITLE=$EVENT_TITLE; BASE=$EVENT_BASE; HEAD=$EVENT_HEAD
          else
            PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open \
              --json title,baseRefName --jq '.[0]')
            if [ -z "$PR" ]; then
              echo "::error::No open pull request for branch $GITHUB_REF_NAME"; exit 1
            fi
            TITLE=$(jq -r .title <<< "$PR")
            BASE_REF=$(jq -r .baseRefName <<< "$PR")
            git fetch --no-tags origin "$BASE_REF"
            BASE=$(git merge-base "origin/$BASE_REF" HEAD); HEAD=$(git rev-parse HEAD)
          fi
          {
            echo "base=$BASE"; echo "head=$HEAD"
            echo "title<<EOF_TITLE"; echo "$TITLE"; echo "EOF_TITLE"
          } >> "$GITHUB_OUTPUT"

      - name: PR title
        env:
          TITLE: ${{ steps.pr.outputs.title }}
        run: printf '%s\n' "$TITLE" | npx --no -- commitlint --verbose

      - name: Commits
        env:
          BASE: ${{ steps.pr.outputs.base }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: npx --no -- commitlint --from "$BASE" --to "$HEAD" --verbose
